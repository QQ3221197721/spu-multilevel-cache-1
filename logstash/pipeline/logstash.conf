# ========================================
# SPU 多级缓存服务 - Logstash Pipeline
# 接收 Logback JSON 日志 → 处理 → 写入 Elasticsearch
# ========================================

input {
  # 接收 Logback LogstashTcpSocketAppender 的 JSON 日志
  tcp {
    port => 5000
    codec => json_lines {
      charset => "UTF-8"
    }
    type => "logback"
  }

  # Filebeat 采集入口（备用）
  beats {
    port => 5044
    type => "filebeat"
  }
}

filter {
  # 添加时间戳处理
  if [type] == "logback" {
    # 解析 @timestamp
    date {
      match => ["@timestamp", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSS"]
      target => "@timestamp"
      timezone => "Asia/Shanghai"
    }

    # 提取 SkyWalking TraceId（从 MDC 或日志消息中）
    if [tid] {
      mutate {
        rename => { "tid" => "traceId" }
      }
    }

    # 日志级别标准化
    if [level] {
      mutate {
        uppercase => ["level"]
      }
    }

    # 按日志级别打标签（用于分级索引）
    if [level] == "ERROR" {
      mutate {
        add_tag => ["error"]
        add_field => { "severity" => "critical" }
      }
    } else if [level] == "WARN" {
      mutate {
        add_tag => ["warning"]
        add_field => { "severity" => "warning" }
      }
    }

    # 异常堆栈合并
    if [stack_trace] {
      mutate {
        rename => { "stack_trace" => "exception" }
      }
    }
  }

  # Filebeat 日志解析
  if [type] == "filebeat" {
    json {
      source => "message"
      target => "parsed"
    }
  }

  # 添加来源标识
  mutate {
    add_field => {
      "[@metadata][index_prefix]" => "spu-cache"
    }
  }
}

output {
  # 按日志级别分索引写入 Elasticsearch
  if "error" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "spu-cache-error-%{+YYYY.MM.dd}"
      template_name => "spu-cache-error"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "spu-cache-app-%{+YYYY.MM.dd}"
      template_name => "spu-cache-app"
    }
  }

  # 调试输出（开发环境可打开）
  # stdout {
  #   codec => rubydebug
  # }
}
