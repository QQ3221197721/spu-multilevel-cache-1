apiVersion: apps/v1
kind: Deployment
metadata:
  name: spu-cache-service
  namespace: spu-cache
  labels:
    app: spu-cache-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: spu-cache-service
  template:
    metadata:
      labels:
        app: spu-cache-service
        version: stable
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
        # Istio Sidecar 注入
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/proxyCPU: "100m"
        sidecar.istio.io/proxyMemory: "128Mi"
        sidecar.istio.io/proxyCPULimit: "500m"
        sidecar.istio.io/proxyMemoryLimit: "512Mi"
        proxy.istio.io/config: |
          holdApplicationUntilProxyStarts: true
          terminationDrainDuration: 30s
        # eBPF 可观测性注解
        cilium.io/hubble-visibility: "<Flow>/<Port>/<Protocol>"
        ebpf.io/monitor: "true"
    spec:
      serviceAccountName: spu-cache-service
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 60
      containers:
        - name: spu-cache-service
          image: spu-cache-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: JAVA_OPTS
              value: "-Xms2g -Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=100 --enable-preview"
            - name: JAVA_TOOL_OPTIONS
              value: "--enable-preview"
            - name: REDIS_CLUSTER_NODES
              valueFrom:
                configMapKeyRef:
                  name: spu-cache-config
                  key: redis.cluster.nodes
            - name: MEMCACHED_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: spu-cache-config
                  key: memcached.servers
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: spu-cache-config
                  key: kafka.bootstrap.servers
            - name: MYSQL_URL
              valueFrom:
                secretKeyRef:
                  name: spu-cache-secret
                  key: mysql.url
            - name: MYSQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: spu-cache-secret
                  key: mysql.username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spu-cache-secret
                  key: mysql.password
            # Zipkin 链路追踪
            - name: ZIPKIN_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: spu-cache-config
                  key: zipkin.endpoint
            - name: ZIPKIN_ENABLED
              value: "true"
            # ELK Logstash
            - name: LOGSTASH_HOST
              valueFrom:
                configMapKeyRef:
                  name: spu-cache-config
                  key: logstash.host
            - name: LOGSTASH_PORT
              value: "5000"
            # Seata
            - name: SEATA_ENABLED
              value: "true"
            # ShardingSphere 分库分表
            - name: SHARDING_ENABLED
              value: "${SHARDING_ENABLED:false}"
            # JWT / 加密密钥
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: spu-cache-secret
                  key: jwt.secret
            - name: DATA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: spu-cache-secret
                  key: encryption.key
            # Apollo 配置中心
            - name: APOLLO_META
              valueFrom:
                configMapKeyRef:
                  name: spu-cache-config
                  key: apollo.meta
            - name: APOLLO_CLUSTER
              value: "default"
            # Canal binlog 监听
            - name: CANAL_SERVER_HOST
              valueFrom:
                configMapKeyRef:
                  name: spu-cache-config
                  key: canal.server.host
            - name: MYSQL_SLAVE_URL
              valueFrom:
                secretKeyRef:
                  name: spu-cache-secret
                  key: mysql.slave.url
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /actuator/probes/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/probes/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/probes/startup
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - spu-cache-service
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: spu-cache-service
  namespace: spu-cache
  labels:
    app: spu-cache-service
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: spu-cache-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spu-cache-service-hpa
  namespace: spu-cache
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spu-cache-service
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spu-cache-config
  namespace: spu-cache
data:
  redis.cluster.nodes: "redis-cluster-0:6379,redis-cluster-1:6379,redis-cluster-2:6379"
  memcached.servers: "memcached-0:11211,memcached-1:11211,memcached-2:11211"
  kafka.bootstrap.servers: "kafka-0:9092,kafka-1:9092,kafka-2:9092"
  zipkin.endpoint: "http://zipkin:9411/api/v2/spans"
  apollo.meta: "http://apollo-configservice:8080"
  logstash.host: "logstash-0"
  mysql.slave.host: "mysql-slave-0"
  canal.server.host: "canal-server"
  es.uris: "http://elasticsearch:9200"
  # 应用级配置
  app.cache.l1.max-size: "10000"
  app.cache.l1.ttl-seconds: "30"
  app.cache.l2.ttl-seconds: "300"
  app.cache.l3.ttl-seconds: "3600"
  app.cache.warmup.enabled: "true"
  app.rate-limit.global-qps: "50000"
  app.rate-limit.ip-qps: "100"
---
apiVersion: v1
kind: Secret
metadata:
  name: spu-cache-secret
  namespace: spu-cache
type: Opaque
stringData:
  mysql.url: "jdbc:mysql://mysql:3306/spu_cache_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai"
  mysql.username: "spu_cache"
  mysql.password: "YourSecurePassword123!"
  mysql.slave.url: "jdbc:mysql://mysql-slave:3306/spu_cache_db?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai"
  mysql.slave.username: "spu_cache_ro"
  mysql.slave.password: "YourSecureSlavePassword123!"
  jwt.secret: "YourJwtSecret256BitKeyHere_ChangeInProduction!!"
  encryption.key: "BASE64_AES256_KEY_CHANGE_IN_PRODUCTION"
  apollo.portal.password: "YourApolloPassword!"
  canal.username: "canal"
  canal.password: "YourCanalPassword!"
