{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "spu-cache.serviceAccountName" . }}
  namespace: {{ include "spu-cache.namespace" . }}
  labels:
    {{- include "spu-cache.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken | default false }}
{{- end }}
---
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "spu-cache.fullname" . }}-role
  namespace: {{ include "spu-cache.namespace" . }}
  labels:
    {{- include "spu-cache.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["endpoints", "pods", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "spu-cache.fullname" . }}-rolebinding
  namespace: {{ include "spu-cache.namespace" . }}
  labels:
    {{- include "spu-cache.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "spu-cache.serviceAccountName" . }}
    namespace: {{ include "spu-cache.namespace" . }}
roleRef:
  kind: Role
  name: {{ include "spu-cache.fullname" . }}-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
{{- if and .Values.rbac.create .Values.rbac.clusterRole.nodeReader }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "spu-cache.fullname" . }}-node-reader
  labels:
    {{- include "spu-cache.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "spu-cache.fullname" . }}-node-reader-binding
  labels:
    {{- include "spu-cache.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "spu-cache.serviceAccountName" . }}
    namespace: {{ include "spu-cache.namespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ include "spu-cache.fullname" . }}-node-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}
