apiVersion: v1
kind: Service
metadata:
  name: {{ include "spu-cache.fullname" . }}
  namespace: {{ include "spu-cache.namespace" . }}
  labels:
    {{- include "spu-cache.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "spu-cache.selectorLabels" . | nindent 4 }}
