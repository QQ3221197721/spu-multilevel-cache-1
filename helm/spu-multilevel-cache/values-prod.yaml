# ============================================================
# 生产环境配置覆盖 (Production)
# 用法: helm install spu-cache . -f values-prod.yaml
# ============================================================

global:
  environment: prod

replicaCount: 3

image:
  pullPolicy: Always
  pullSecrets:
    - name: registry-pull-secret

env:
  SPRING_PROFILES_ACTIVE: "prod"
  JAVA_OPTS: "-Xms2g -Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=50 -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/heapdump.hprof --enable-preview"
  SEATA_ENABLED: "true"
  SHARDING_ENABLED: "true"
  ZIPKIN_ENABLED: "true"

resources:
  requests:
    cpu: 2000m
    memory: 4Gi
  limits:
    cpu: 4000m
    memory: 8Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70

pdb:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true

ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "5000"
    nginx.ingress.kubernetes.io/limit-connections: "2000"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://www.example.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS"
  hosts:
    - host: spu-cache.prod.example.com
      paths:
        - path: /api/spu
          pathType: Prefix
  tls:
    - hosts:
        - spu-cache.prod.example.com
      secretName: spu-cache-prod-tls

configMap:
  redis.cluster.nodes: "redis-prod-0:6379,redis-prod-1:6379,redis-prod-2:6379,redis-prod-3:6379,redis-prod-4:6379,redis-prod-5:6379"
  memcached.servers: "memcached-prod-0:11211,memcached-prod-1:11211,memcached-prod-2:11211"
  kafka.bootstrap.servers: "kafka-prod-0:9092,kafka-prod-1:9092,kafka-prod-2:9092"
  apollo.meta: "http://apollo-configservice-prod:8080"
  es.uris: "http://es-prod-0:9200,http://es-prod-1:9200"
  app.cache.l1.max-size: "50000"
  app.rate-limit.global-qps: "100000"
  app.rate-limit.ip-qps: "200"

# 生产密钥请通过 --set 或 External Secrets Operator 注入
# helm install ... --set secret.mysql.password=xxx --set secret.jwt.secret=xxx

canary:
  enabled: false

# Istio 生产覆盖
istio:
  enabled: true
  sidecar:
    proxyCPU: "200m"
    proxyMemory: "256Mi"
    proxyCPULimit: "1000m"
    proxyMemoryLimit: "1Gi"
  mtls: STRICT
  trafficRouting:
    canaryWeight: 5
    stableWeight: 95

# eBPF 生产覆盖
ebpf:
  enabled: true

# 生产环境禁用混沌实验
chaosMesh:
  enabled: false

# GraalVM Native Image (生产可选启用)
nativeImage:
  enabled: false
