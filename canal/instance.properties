#################################################
## Canal Instance 配置 - 监听 SPU 商品表变更
## 部署路径: canal.deployer/conf/spu_cache/instance.properties
##
## 数据流: MySQL binlog -> Canal -> RocketMQ -> CanalBinlogListener -> Cache Invalidation
#################################################

#################################################
## MySQL 主库连接配置
#################################################
canal.instance.master.address = ${CANAL_MYSQL_HOST:mysql}:${CANAL_MYSQL_PORT:3306}
canal.instance.master.journal.name =
canal.instance.master.position =
canal.instance.master.timestamp =
canal.instance.master.gtid =

# 数据库认证
canal.instance.dbUsername = ${CANAL_DB_USERNAME:canal}
canal.instance.dbPassword = ${CANAL_DB_PASSWORD:canal}
canal.instance.connectionCharset = UTF-8

# 连接池配置
canal.instance.standby.address =
canal.instance.standby.journal.name =
canal.instance.standby.position =
canal.instance.standby.timestamp =
canal.instance.standby.gtid =

#################################################
## GTID 模式配置（推荐 MySQL 5.7+ 启用）
#################################################
# 启用 GTID 可避免主从切换时丢数据
canal.instance.gtidon = ${CANAL_GTID_ENABLED:true}

#################################################
## binlog 过滤规则
#################################################
# 监听的数据库和表（正则表达式）
# 监听 spu_cache_db 下的核心业务表
canal.instance.filter.regex = spu_cache_db\\.t_spu,spu_cache_db\\.t_sku,spu_cache_db\\.t_spu_detail,spu_cache_db\\.t_spu_attribute

# 黑名单（不监听的表）
canal.instance.filter.black.regex = spu_cache_db\\.t_message_outbox,spu_cache_db\\.t_dead_letter_message,spu_cache_db\\.flyway_schema_history,spu_cache_db\\.undo_log

# DDL 变更过滤
canal.instance.filter.druid.ddl = true

#################################################
## RocketMQ 发送配置
#################################################
# 发送到 RocketMQ 的 Topic
canal.mq.topic = CANAL_BINLOG_TOPIC

# 分区策略：按表名 + 主键 hash 分区，保证同一行数据的变更顺序
canal.mq.dynamicTopic = spu_cache_db\\.t_spu:CANAL_SPU_BINLOG,spu_cache_db\\.t_sku:CANAL_SKU_BINLOG

# 分区数量（与 RocketMQ Topic 的 Queue 数对应）
canal.mq.partitionsNum = 8

# 分区 hash 字段（按主键分区，保证同一记录变更有序）
canal.mq.partitionHash = spu_cache_db\\.t_spu:spu_id,spu_cache_db\\.t_sku:sku_id

# 启用 FlatMessage 格式（JSON 格式，便于消费端解析）
canal.mq.flatMessage = true

# 访问 Key（可选，Canal Server ACL）
canal.mq.accessChannel = local

# 发送批次大小
canal.mq.canalBatchSize = 50
canal.mq.canalGetTimeout = 100

# 消息发送超时（ms）
canal.mq.send.thread.size = 2

#################################################
## TSDB 配置（Table Schema 变更历史）
#################################################
canal.instance.tsdb.enable = true
canal.instance.tsdb.dir = ${canal.file.data.dir:../conf}/${canal.instance.destination:}
canal.instance.tsdb.url = jdbc:h2:${canal.instance.tsdb.dir}/h2;CACHE_SIZE=1000;MODE=MYSQL;
canal.instance.tsdb.dbUsername = canal
canal.instance.tsdb.dbPassword = canal
canal.instance.tsdb.spring.xml = classpath:spring/tsdb/h2-tsdb.xml

#################################################
## binlog 消费位点持久化
#################################################
# 持久化方式：file | zookeeper | mixed
canal.instance.store.mode = file
canal.instance.store.file.data.dir = ../conf
canal.instance.store.file.flush.period = 1000

#################################################
## 心跳检测
#################################################
canal.instance.detecting.enable = true
canal.instance.detecting.sql = select 1
canal.instance.detecting.interval.time = 3
canal.instance.detecting.retry.threshold = 3
